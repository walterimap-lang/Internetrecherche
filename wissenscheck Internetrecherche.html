<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wissensüberprüfung: Informationsrecherche im Internet</title>
<style>
:root{
  --bg:#f4f2ee; --card:#ffffff; --border:#e0ddd4; --border-strong:#c9c5b8;
  --text:#2b2a26; --text-sec:#6b6a63; --accent:#1f4e5f; --accent-fg:#ffffff;
  --success-bg:#e7f4ea; --success-text:#1e6b34; --success-border:#bfe2c8;
  --danger-bg:#fbeaea; --danger-text:#a3302f; --danger-border:#f0c4c3;
  --radius:12px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1b18; --card:#26251f; --border:#3a3830; --border-strong:#4d4a3f;
    --text:#efeee8; --text-sec:#a9a79c; --accent:#5fb8d9; --accent-fg:#0d2530;
    --success-bg:#173a24; --success-text:#8fd6a6; --success-border:#295c39;
    --danger-bg:#3a1f1f; --danger-text:#f0a3a1; --danger-border:#5c2b2a;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1b18; --card:#26251f; --border:#3a3830; --border-strong:#4d4a3f;
  --text:#efeee8; --text-sec:#a9a79c; --accent:#5fb8d9; --accent-fg:#0d2530;
  --success-bg:#173a24; --success-text:#8fd6a6; --success-border:#295c39;
  --danger-bg:#3a1f1f; --danger-text:#f0a3a1; --danger-border:#5c2b2a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 40px;}
h1{font-size:20px;font-weight:600;margin:0 0 4px;}
.sub{font-size:13px;color:var(--text-sec);margin:0 0 20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;overflow-x:auto;}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-sec);}
input[type=text]{width:100%;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg);color:var(--text);}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;}
button{font-size:15px;font-weight:600;padding:10px 18px;border-radius:8px;border:none;background:var(--accent);color:var(--accent-fg);cursor:pointer;}
button:active{transform:scale(0.98);}
button.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.err{color:var(--danger-text);font-size:13px;margin-top:6px;display:none;}
.progress{font-size:12px;color:var(--text-sec);margin-bottom:10px;}
.qtext{font-size:16px;font-weight:600;margin:0 0 14px;line-height:1.4;}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg);color:var(--text);font-size:14px;font-weight:400;cursor:pointer;}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:var(--success-bg);border-color:var(--success-border);color:var(--success-text);font-weight:600;}
.opt.wrong{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger-text);font-weight:600;}
.opt[disabled]{cursor:default;}
.explain{font-size:13px;color:var(--text-sec);margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:none;}
.navrow{display:flex;justify-content:flex-end;margin-top:16px;}
.result-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
.result-name{font-size:15px;font-weight:600;}
.result-date{font-size:12px;color:var(--text-sec);}
.score-big{font-size:38px;font-weight:700;margin:0;}
.score-sub{font-size:13px;color:var(--text-sec);margin:2px 0 18px;}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:100px;margin-bottom:16px;}
.badge.pass{background:var(--success-bg);color:var(--success-text);border:1px solid var(--success-border);}
.badge.fail{background:var(--danger-bg);color:var(--danger-text);border:1px solid var(--danger-border);}
.recap{font-size:13px;margin:6px 0;padding:8px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--border);}
.recap.ok{border-left:3px solid var(--success-text);}
.recap.no{border-left:3px solid var(--danger-text);}
.hint{font-size:12px;color:var(--text-sec);margin-top:16px;line-height:1.5;}
.screenshot-note{margin-top:18px;padding:12px 14px;border-radius:8px;background:var(--bg);border:1px dashed var(--border-strong);font-size:13px;color:var(--text-sec);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Wissensüberprüfung: Informationsrecherche im Internet</h1>
  <p class="sub">Klassische Suche und KI-Suche</p>
  <div class="card" id="app"></div>
</div>

<script>
const QUESTIONS = [
  {
    q: "Welche vier Schritte umfasst der Informationsprozess weiterhin – egal ob klassisch oder mit KI?",
    options: [
      "Recherche, Prüfung, Analyse, Anwendung",
      "Suchen, Klicken, Speichern, Löschen",
      "Frage stellen, Antwort kopieren, einfügen, abgeben",
      "Google öffnen, Stichwort eingeben, ersten Treffer nehmen"
    ],
    correct: 0,
    explain: "Der Informationsprozess bleibt gleich: Recherche, Prüfung, Analyse, Anwendung – unabhängig davon, ob Sie klassisch oder mit KI suchen."
  },
  {
    q: "Was ist der größte Unterschied zwischen klassischer Suche und KI-Suche?",
    options: [
      "Bei der KI-Suche gibt es keine Werbung mehr",
      "Die KI-Suche liefert direkt eine fertig formulierte Antwort statt einer Linkliste",
      "Die klassische Suche funktioniert nur noch auf dem Handy",
      "Es gibt keinen Unterschied"
    ],
    correct: 1,
    explain: "Klassische Suchmaschinen liefern Linklisten, die Sie selbst auswerten. KI-Suchen fassen die Antwort bereits für Sie zusammen."
  },
  {
    q: "Was bedeutet der Begriff „Halluzination“ im Zusammenhang mit KI-Antworten?",
    options: [
      "Die KI zeigt bunte, unpassende Bilder an",
      "Die KI stürzt ab und liefert keine Antwort",
      "Die KI erfindet überzeugend klingende, aber falsche Angaben",
      "Die KI übersetzt die Antwort in eine andere Sprache"
    ],
    correct: 2,
    explain: "Halluzinationen sind frei erfundene, aber flüssig und überzeugend formulierte Angaben – auch Zahlen, Zitate oder Links können erfunden sein."
  },
  {
    q: "Eine KI-Suche verlinkt Ihnen Quellen zu ihrer Antwort. Was sollten Sie damit tun?",
    options: [
      "Nichts, die KI hat die Quellen bereits geprüft",
      "Die Quellen ignorieren, sie sind nur zur Dekoration da",
      "Die Quellen tatsächlich öffnen und prüfen, ob sie die Aussage stützen",
      "Nur die erste Quelle öffnen, die anderen sind unwichtig"
    ],
    correct: 2,
    explain: "Verlinkte Quellen sollten Sie öffnen und kontrollieren, ob sie die Aussage der KI wirklich stützen – sonst bleibt die Prüfung unvollständig."
  },
  {
    q: "Was versteht man unter „lateralem Lesen“?",
    options: [
      "Einen Text von links nach rechts lesen",
      "Zusätzlich recherchieren, was andere, unabhängige Quellen über einen Anbieter oder eine Seite sagen",
      "Einen Text quer überfliegen, um Zeit zu sparen",
      "Nur die Überschrift eines Artikels lesen"
    ],
    correct: 1,
    explain: "Beim lateralen Lesen prüfen Sie eine Quelle nicht nur für sich, sondern suchen aktiv nach dem, was andere unabhängige Quellen über diesen Anbieter sagen."
  },
  {
    q: "Warum sollten Sie keine persönlichen oder sensiblen Daten in eine KI-Chat-Eingabe tippen?",
    options: [
      "Weil die KI dadurch langsamer wird",
      "Weil solche Eingaben Ihren eigenen Bereich verlassen und nicht mehr unter Ihrer Kontrolle sind",
      "Weil die Antwort dadurch kürzer wird",
      "Das ist kein Problem, KI-Chats sind grundsätzlich sicher"
    ],
    correct: 1,
    explain: "Was Sie in einen KI-Chat eingeben, verlässt Ihren eigenen Bereich – das gilt besonders für persönliche oder sensible Informationen."
  },
  {
    q: "Sneaker-Weiterverkauf: Welche Kombination von Merkmalen deutet am ehesten auf ein unseriöses Angebot bzw. einen Fake-Shop hin?",
    options: [
      "Bezahlung nur per Vorabüberweisung, kein Impressum, Verkäufer ohne Bewertungen",
      "Der Shop hat ein Impressum, echte Bewertungen und bietet Rechnungskauf an",
      "Der Preis entspricht etwa dem sonst üblichen Marktwert",
      "Der Anbieter ist auf einer bekannten Plattform wie StockX oder GOAT gelistet"
    ],
    correct: 0,
    explain: "Vorabüberweisung ohne Alternative, fehlendes Impressum und ein Verkäufer ohne Bewertungen sind klassische Warnsignale für ein unseriöses Angebot."
  },
  {
    q: "Welche Aussage über Webkataloge und Metasuchmaschinen stimmt heute?",
    options: [
      "Webkataloge sind die wichtigste Informationsquelle im Internet",
      "Webkataloge spielen praktisch keine Rolle mehr, Metasuchmaschinen sind eine Nische",
      "Beide wurden vollständig durch Social Media ersetzt",
      "Beide sind heute wichtiger als KI-Suchen"
    ],
    correct: 1,
    explain: "Klassische Webkataloge sind praktisch verschwunden. Metasuchmaschinen existieren zwar noch, spielen aber nur eine Nischenrolle."
  }
];

const STORAGE_KEY = "infocheck_result_v1";
const app = document.getElementById("app");
let state = { idx: 0, score: 0, name: "" };

function safeGet(key){
  try { return localStorage.getItem(key); } catch(e){ return null; }
}
function safeSet(key, val){
  try { localStorage.setItem(key, val); return true; } catch(e){ return false; }
}

function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString("de-AT") + ", " + d.toLocaleTimeString("de-AT", {hour:"2-digit", minute:"2-digit"});
}

function renderStart(){
  const existingRaw = safeGet(STORAGE_KEY);
  if (existingRaw) {
    try {
      const existing = JSON.parse(existingRaw);
      renderResult(existing.name, existing.score, existing.total, existing.ts, existing.answers);
      return;
    } catch(e) {}
  }
  app.innerHTML = `
    <label for="nameInput">Familienname</label>
    <input type="text" id="nameInput" placeholder="z. B. Redl" autocomplete="off">
    <p class="err" id="nameErr">Bitte tragen Sie Ihren Familiennamen ein, bevor Sie starten.</p>
    <p class="hint">Sie können diesen Wissenscheck nur einmal in diesem Browser durchführen. Ihr Ergebnis wird danach automatisch angezeigt.</p>
    <div class="navrow"><button id="startBtn">Check starten</button></div>
  `;
  document.getElementById("startBtn").addEventListener("click", () => {
    const val = document.getElementById("nameInput").value.trim();
    const err = document.getElementById("nameErr");
    if (!val) {
      err.style.display = "block";
      return;
    }
    err.style.display = "none";
    state.name = val;
    state.idx = 0;
    state.score = 0;
    state.answers = [];
    renderQuestion();
  });
  document.getElementById("nameInput").addEventListener("input", () => {
    document.getElementById("nameErr").style.display = "none";
  });
}

function renderQuestion(){
  const q = QUESTIONS[state.idx];
  app.innerHTML = `
    <p class="progress">Frage ${state.idx+1} von ${QUESTIONS.length}</p>
    <p class="qtext"></p>
    <div id="opts"></div>
    <div class="explain" id="explain"></div>
    <div class="navrow"><button id="nextBtn" style="display:none;">${state.idx === QUESTIONS.length-1 ? "Ergebnis anzeigen" : "Weiter"}</button></div>
  `;
  app.querySelector(".qtext").textContent = q.q;
  const optsDiv = document.getElementById("opts");
  q.options.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = opt;
    b.addEventListener("click", () => selectAnswer(i));
    optsDiv.appendChild(b);
  });
}

function selectAnswer(i){
  const q = QUESTIONS[state.idx];
  const opts = document.querySelectorAll("#opts .opt");
  opts.forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.correct) b.classList.add("correct");
    else if (idx === i && i !== q.correct) b.classList.add("wrong");
  });
  const correct = (i === q.correct);
  if (correct) state.score++;
  state.answers.push({ q: q.q, correct: correct });
  const exp = document.getElementById("explain");
  exp.textContent = q.explain;
  exp.style.display = "block";
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.style.display = "inline-block";
  nextBtn.addEventListener("click", () => {
    if (state.idx < QUESTIONS.length - 1) {
      state.idx++;
      renderQuestion();
    } else {
      finish();
    }
  }, { once: true });
}

function finish(){
  const ts = Date.now();
  const result = { name: state.name, score: state.score, total: QUESTIONS.length, ts: ts, answers: state.answers };
  safeSet(STORAGE_KEY, JSON.stringify(result));
  renderResult(state.name, state.score, QUESTIONS.length, ts, state.answers);
}

function renderResult(name, score, total, ts, answers){
  const pct = Math.round((score/total)*100);
  const pass = pct >= 60;
  let recapHtml = "";
  if (answers && answers.length) {
    recapHtml = answers.map((a, i) => `<div class="recap ${a.correct ? "ok" : "no"}">Frage ${i+1}: ${a.correct ? "richtig" : "nicht richtig"}</div>`).join("");
  }
  app.innerHTML = `
    <div class="result-header">
      <span class="result-name">${escapeHtml(name)}</span>
      <span class="result-date">${fmtDate(ts)}</span>
    </div>
    <span class="badge ${pass ? "pass" : "fail"}">${pass ? "bestanden" : "wiederholen empfohlen"}</span>
    <p class="score-big">${score} / ${total}</p>
    <p class="score-sub">${pct}% richtig beantwortet</p>
    ${recapHtml}
    <div class="screenshot-note">Machen Sie jetzt einen Screenshot dieses Ergebnisses (inklusive Ihres Namens oben) und laden Sie ihn bei der Teams-Aufgabe hoch.</div>
  `;
}

function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

renderStart();
</script>
</body>
</html>
